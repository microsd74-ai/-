name: UOP WORK — Windows build
on:
  workflow_dispatch:
  push:
    paths:
      - 'UopWork/**'
      - '.github/workflows/uop-work.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UopWork
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: UopWork/global.json
      - name: Core checks
        run: dotnet run --project tests/UopWork.Checks -c Release
      - name: Windows interface checks and screenshots
        run: dotnet run --project tests/UopWork.UiChecks -c Release -- artifacts/screenshots
      - name: Build portable Windows x64
        run: dotnet publish src/UopWork.Desktop/UopWork.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/UopWork
      - name: Add launchers and instructions
        shell: pwsh
        run: |
          Copy-Item Start-Demo.cmd artifacts/UopWork/
          Copy-Item README.md artifacts/UopWork/README.md
          Copy-Item docs artifacts/UopWork/docs -Recurse
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: UOP-WORK-interface-screenshots
          path: UopWork/artifacts/screenshots
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v5
        with:
          name: UOP-WORK-win-x64
          path: UopWork/artifacts/UopWork
          if-no-files-found: error
          retention-days: 14
